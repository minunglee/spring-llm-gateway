name: CI

on:
  push:
    branches: [main]
  pull_request:
  # GitHub가 머지 이벤트를 놓쳐 배포가 안 돌았을 때 Actions 화면에서 손으로 다시 돌린다
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v5
      # 화면 스크립트 문법 오류는 서버 테스트로 잡히지 않으므로 따로 검사한다
      - name: JavaScript 문법 검사
        run: for f in src/main/resources/static/*.js; do node --check "$f"; done
      # 통합 테스트는 Testcontainers로 실제 PostgreSQL·Redis를 띄워 실행한다
      - run: ./gradlew build
      - uses: actions/upload-artifact@v4
        if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
        with:
          name: app-jar
          path: build/libs/spring-llm-gateway-*-SNAPSHOT.jar
          retention-days: 1

  # main에 머지되면 이미지를 만들어 서버에 배포한다
  deploy:
    needs: build
    if: (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: production
    concurrency: production
    permissions:
      contents: read
      packages: write
    env:
      IMAGE: ghcr.io/minunglee/spring-llm-gateway
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v4
        with:
          name: app-jar
          path: build/libs

      - name: 이미지 빌드 및 푸시
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin
          docker build -t $IMAGE:${{ github.sha }} -t $IMAGE:latest .
          docker push $IMAGE:${{ github.sha }}
          docker push $IMAGE:latest

      - name: SSH 접속 준비
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SERVER_SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          echo "${{ secrets.SERVER_KNOWN_HOSTS }}" > ~/.ssh/known_hosts

      - name: 서버 배포
        env:
          TARGET: ${{ secrets.SERVER_USER }}@${{ secrets.SERVER_HOST }}
        run: |
          ssh -i ~/.ssh/deploy_key $TARGET 'mkdir -p app/nginx sites'
          scp -i ~/.ssh/deploy_key deploy/compose.prod.yaml $TARGET:app/
          # 이 저장소 몫의 설정만 올린다 (다른 사이트의 설정 파일은 건드리지 않음)
          scp -i ~/.ssh/deploy_key deploy/nginx/00-common.conf deploy/nginx/gateway.conf $TARGET:app/nginx/
          scp -i ~/.ssh/deploy_key deploy/backup.sh $TARGET:app/
          ssh -i ~/.ssh/deploy_key $TARGET bash -s <<EOF
            set -e
            cd ~/app
            echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin
            export IMAGE_TAG=${{ github.sha }}
            # 서버에서 손으로 재시작해도 같은 버전이 뜨도록 현재 버전을 .env에 기록한다
            sed -i '/^IMAGE_TAG=/d' .env && echo "IMAGE_TAG=${{ github.sha }}" >> .env
            docker compose -f compose.prod.yaml pull --quiet
            docker compose -f compose.prod.yaml up -d --remove-orphans
            # nginx.conf만 바뀌면 컨테이너가 다시 만들어지지 않으므로 설정을 직접 다시 읽게 한다
            # 이 스크립트는 ssh의 표준 입력으로 들어오므로, exec가 남은 줄을 입력으로 삼켜버리지 않게 막는다
            docker compose -f compose.prod.yaml exec -T nginx nginx -t < /dev/null
            docker compose -f compose.prod.yaml exec -T nginx nginx -s reload < /dev/null
            docker logout ghcr.io
            docker image prune -f
            # 매일 04:30 DB 백업 (수집 배치가 도는 0·6·12·18시를 피함). 같은 줄이 있으면 바꿔 끼운다
            chmod +x ~/app/backup.sh && mkdir -p ~/backups
            (crontab -l 2>/dev/null | grep -v 'app/backup.sh' || true; echo "30 4 * * * \$HOME/app/backup.sh >> \$HOME/backups/backup.log 2>&1") | crontab -
          EOF

      - name: 헬스 체크
        run: |
          for i in $(seq 1 30); do
            if curl -fsS https://minunglee.cloud/actuator/health | grep -q UP; then
              echo "배포 성공"; exit 0
            fi
            sleep 5
          done
          echo "헬스 체크 실패"; exit 1
