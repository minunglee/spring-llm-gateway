<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<title>LLM Gateway 체험</title>
	<link rel="stylesheet" th:href="@{/style.css}">
</head>
<body>
<main class="container">
	<header>
		<a class="back" th:href="@{/}">← 포트폴리오</a>
		<h1>LLM Gateway 체험</h1>
		<p class="lead">질문을 보내면 게이트웨이를 거쳐 AI가 답하고, 토큰·비용·응답시간을 함께 보여줍니다.</p>
		<div class="badges">
			<span class="badge" th:classappend="${mode == 'mock'} ? 'badge-mock' : 'badge-live'"
				  th:text="${mode == 'mock'} ? '가짜 응답 모드 (비용 0원)' : '실제 Claude 호출'">모드</span>
			<span class="badge" th:text="${requester.model()}">모델</span>
			<span class="badge" th:classappend="${requester.invited()} ? 'badge-invite'"
				  th:text="${requester.invited()} ? '초대코드' : '게스트'">등급</span>
		</div>
	</header>

	<section class="card budget" aria-label="오늘 전체 예산">
		<div class="budget-head">
			<span>오늘 AI 예산</span>
			<span id="budget-text">-</span>
		</div>
		<div class="bar"><div id="budget-bar" class="bar-fill" style="width: 0%"></div></div>
		<p class="hint"
		   th:text="|시간당 ${requester.hourly()}회, 하루 ${requester.daily()}회까지 사용할 수 있고, 예산이 소진되면 데모 응답으로 바뀝니다.|">
			사용 한도 안내</p>
	</section>

	<form id="chat-form" class="card">
		<label for="message">질문</label>
		<textarea id="message" name="message" rows="4" maxlength="2000"
				  placeholder="예: Redis Lua 스크립트가 원자적인 이유를 설명해줘"></textarea>
		<!-- 게스트 봇 확인 (대부분 클릭 없이 자동 통과, 의심스러울 때만 체크 박스 표시) -->
		<div th:if="${turnstileSiteKey != null}" id="turnstile" class="turnstile"
			 th:attr="data-sitekey=${turnstileSiteKey}"></div>
		<div class="form-footer">
			<span id="counter">0 / 2,000</span>
			<button type="submit" id="submit">보내기</button>
		</div>
	</form>

	<section id="result" class="card" hidden>
		<h2>응답</h2>
		<p id="answer"></p>
		<dl class="metrics">
			<div><dt>입력 토큰</dt><dd id="input-tokens"></dd></div>
			<div><dt>출력 토큰</dt><dd id="output-tokens"></dd></div>
			<div><dt>비용</dt><dd id="cost"></dd></div>
			<div><dt>응답시간</dt><dd id="latency"></dd></div>
		</dl>
		<p id="remaining" class="hint"></p>
	</section>

	<p id="error" class="error" role="alert" hidden></p>

	<section th:replace="~{fragments :: invite(${requester})}"></section>
</main>
<script th:src="@{/app.js}"></script>
<script th:if="${turnstileSiteKey != null}"
		src="https://challenges.cloudflare.com/turnstile/v0/api.js?render=explicit&onload=onTurnstileLoad" async defer></script>
</body>
</html>
