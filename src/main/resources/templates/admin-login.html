<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<meta name="robots" content="noindex, nofollow">
	<title>관리자</title>
	<link rel="stylesheet" th:href="@{/style.css}">
</head>
<body>
<main class="container admin-login">
	<div class="block-title">
		<span class="fold-head">
			<span class="fold-label">ADMIN</span>
			<span class="fold-name">관리자 로그인</span>
		</span>
	</div>
	<form class="card" method="post" th:action="@{/admin/login}">
		<label for="token">관리자 토큰</label>
		<div class="invite-row">
			<input id="token" name="token" type="password" autocomplete="current-password" required>
			<button type="submit">로그인</button>
		</div>
		<p class="error" th:if="${error == 'invalid'}">토큰이 올바르지 않습니다.</p>
		<p class="error" th:if="${error == 'locked'}">시도가 너무 많습니다. 잠시 후 다시 시도해주세요.</p>
	</form>
</main>
</body>
</html>
