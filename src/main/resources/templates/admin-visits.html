<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<meta name="robots" content="noindex, nofollow">
	<title>방문 통계 | 관리자</title>
	<link rel="stylesheet" th:href="@{/style.css}">
</head>
<body>
<main class="container admin">
	<div class="admin-top">
		<a class="back" th:href="@{/admin}">← 대시보드</a>
		<nav class="range-tabs" aria-label="기간">
			<a th:each="r : ${ {7, 30, 90} }" th:href="@{/admin/visits(days=${r})}" th:text="|${r}일|"
			   th:classappend="${r == days} ? 'active'">기간</a>
		</nav>
	</div>

	<th:block th:replace="~{admin-visit-fragments :: site('MINUNGLEE.CLOUD', '포트폴리오 · minunglee.cloud', ${cloudVisits})}"></th:block>
	<th:block th:replace="~{admin-visit-fragments :: site('JIPDON.COM', '집돈 계산기 · jipdon.com', ${jipdonVisits})}"></th:block>

	<p class="hint">원래 IP는 저장하지 않고 하루 단위 해시로만 순방문자를 셉니다. 검색엔진 로봇과 관리자 본인의 방문은 빠집니다.
		순방문자 합계는 날짜마다 센 값을 더한 것이라, 여러 날 다시 온 사람은 여러 번 셉니다.</p>
</main>

</body>
</html>
