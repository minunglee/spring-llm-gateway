spring:
  application:
    name: spring-llm-gateway
  config:
    # 로컬 비밀값(.env)은 Git에 올리지 않는다. .env.example 참고
    # 테스트는 로컬 .env의 영향을 받지 않도록 GATEWAY_ENV_FILE로 다른 경로를 가리킨다 (build.gradle)
    import: optional:file:${GATEWAY_ENV_FILE:.env}[.properties]
  threads:
    virtual:
      enabled: true
  web:
    resources:
      # CSS·JS 주소에 내용 해시를 붙여, 배포 후 브라우저에 남은 예전 파일이 쓰이지 않게 한다
      chain:
        strategy:
          content:
            enabled: true
            paths: /**
      cache:
        cachecontrol:
          max-age: 365d
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate

management:
  endpoints:
    web:
      exposure:
        include: health

gateway:
  llm:
    # mock: 가짜 응답(비용 0원) / anthropic: 실제 Claude API 호출
    mode: ${GATEWAY_LLM_MODE:mock}
    # 데모 답변 최대 길이. 선차감 금액(최대 비용)이 이 값에 비례하므로 데모에 필요한 만큼만 둔다
    max-tokens: 512
    mock-latency: 300ms
    anthropic-api-key: ${ANTHROPIC_API_KEY:}
  limit:
    ip-salt: ${GATEWAY_IP_SALT:local-dev-salt}
    zone: Asia/Seoul
    # 예산 칸이 진행 중인 요청들의 선차감으로 차 있으면, 정산되며 자리가 나길 최대 이만큼 기다린다
    budget-wait: 3s
    # 등급별 정책. 예산은 등급마다 따로 잡아 게스트가 몰려도 초대코드 사용자 몫이 남게 한다 (합계 하루 $1)
    guest:
      model: claude-haiku-5-5
      hourly: 5
      daily: 20
      daily-budget-usd: 0.50
    invite:
      model: claude-sonnet-5-5
      hourly: 30
      daily: 100
      daily-budget-usd: 0.50
    # jipdon.com AI 계산기 안내. 짧은 분류·안내라 싼 모델로 충분하고, 예산을 따로 둬 포트폴리오 데모 몫을 지킨다
    jipdon:
      model: claude-haiku-5-5
      hourly: 10
      daily: 30
      daily-budget-usd: 0.30
  internal:
    # 같은 서버의 다른 서비스가 /internal/llm 을 부를 때 보내는 공유 토큰 (비어 있으면 막는다)
    jipdon-token: ${JIPDON_INTERNAL_TOKEN:}
  visit:
    # jipdon.com 방문 통계·수집 현황을 같은 서버의 jipdon-api에서 읽는다 (Docker 네트워크 안, 공유 토큰)
    jipdon-internal-url: http://jipdon-api:8090/internal
    jipdon-token: ${JIPDON_INTERNAL_TOKEN:}
  invite:
    # 초대코드 쿠키 서명용 비밀값
    cookie-secret: ${GATEWAY_COOKIE_SECRET:local-dev-cookie-secret}
    cookie-max-age: 7d
  admin:
    # 비어 있으면 관리자 API(/admin/**)를 막는다
    token: ${GATEWAY_ADMIN_TOKEN:}
  turnstile:
    # Cloudflare Turnstile 봇 확인. 둘 다 있어야 켜진다 (비밀 키는 서버 .env에만)
    site-key: ${GATEWAY_TURNSTILE_SITE_KEY:}
    secret-key: ${GATEWAY_TURNSTILE_SECRET_KEY:}
  resume:
    # 이력서 원본(resume.json, resume.pdf) 폴더. Git에 올리지 않는다
    dir: ${GATEWAY_RESUME_DIR:private}
  pricing:
    # USD / 100만 토큰 (2026-10-06 Anthropic 공식 가격표)
    models:
      claude-haiku-5-5:
        input: 0.10
        output: 0.50
      claude-sonnet-5-5:
        input: 2.00
        output: 10.00
      claude-opus-5-5:
        input: 4.00
        output: 20.00
