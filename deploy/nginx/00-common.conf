# 서버 공통 Nginx 설정. 이 폴더(서버의 app/nginx)의 *.conf 파일을 모두 읽는다.
#   00-common.conf, gateway.conf  ← 이 저장소가 배포
#   jipdon.conf                   ← jipdon 저장소가 배포
# 사이트별 파일로 나눠, 한 프로젝트의 배포가 다른 프로젝트 설정을 덮어쓰지 않게 한다.
#
# 인증서: Let's Encrypt (서버의 certbot이 발급·자동 갱신, /etc/letsencrypt)
ssl_protocols TLSv1.2 TLSv1.3;
ssl_session_cache shared:SSL:5m;
ssl_session_timeout 1d;

# HTTP 기본 서버: 모든 도메인의 인증서 발급·갱신 확인 경로를 열고, 나머지는 포트폴리오로 보낸다.
# IP로 직접 들어오는 요청도 여기서 처리한다. 다른 사이트는 자기 설정 파일에서 이름으로 먼저 잡는다.
server {
    listen 80 default_server;
    server_name _;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://minunglee.cloud$request_uri;
    }
}
