# minunglee.cloud: 포트폴리오와 LLM 게이트웨이

# 예전 주소. 이미 공유된 링크가 깨지지 않도록 공식 주소의 게이트웨이 페이지로 보낸다.
server {
    listen 443 ssl;
    http2 on;
    server_name gateway.minunglee.cloud;

    ssl_certificate /etc/letsencrypt/live/minunglee.cloud/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/minunglee.cloud/privkey.pem;

    location = / {
        return 301 https://minunglee.cloud/gateway;
    }

    location / {
        return 301 https://minunglee.cloud$request_uri;
    }
}

# 공식 주소: 포트폴리오(/)와 각 프로젝트(/gateway 등)
server {
    listen 443 ssl;
    http2 on;
    server_name minunglee.cloud;

    ssl_certificate /etc/letsencrypt/live/minunglee.cloud/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/minunglee.cloud/privkey.pem;

    # 브라우저가 이후 이 도메인을 항상 HTTPS로만 접속하게 한다
    add_header Strict-Transport-Security "max-age=31536000" always;

    # 질문은 최대 2,000자라 큰 요청 본문은 받지 않는다
    client_max_body_size 16k;

    location / {
        proxy_pass http://app:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        # 클라이언트가 보낸 X-Forwarded-For를 그대로 이어붙이면 IP를 위조해 사용량 제한을 우회할 수 있다.
        # Nginx가 유일한 입구이므로 실제 접속 IP로 덮어쓴다.
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Claude 응답 대기를 고려한 타임아웃
        proxy_read_timeout 60s;
    }
}
