# 인증서: Let's Encrypt (서버의 certbot이 발급·자동 갱신, /etc/letsencrypt)
ssl_protocols TLSv1.2 TLSv1.3;
ssl_session_cache shared:SSL:5m;
ssl_session_timeout 1d;

# HTTP: 인증서 발급·갱신 확인 경로만 열고, 나머지는 HTTPS 게이트웨이 주소로 보낸다.
# IP로 직접 들어오는 요청도 여기서 도메인으로 보낸다.
server {
    listen 80 default_server;
    server_name _;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://gateway.minunglee.cloud$request_uri;
    }
}

# 대표 도메인은 아직 별도 페이지가 없어 게이트웨이로 보낸다 (이후 포트폴리오 첫 페이지로 교체)
server {
    listen 443 ssl;
    http2 on;
    server_name minunglee.cloud;

    ssl_certificate /etc/letsencrypt/live/minunglee.cloud/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/minunglee.cloud/privkey.pem;

    return 302 https://gateway.minunglee.cloud$request_uri;
}

server {
    listen 443 ssl;
    http2 on;
    server_name gateway.minunglee.cloud;

    ssl_certificate /etc/letsencrypt/live/minunglee.cloud/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/minunglee.cloud/privkey.pem;

    # 브라우저가 이후 이 도메인을 항상 HTTPS로만 접속하게 한다
    add_header Strict-Transport-Security "max-age=31536000" always;

    # 질문은 최대 2,000자라 큰 요청 본문은 받지 않는다
    client_max_body_size 16k;

    location / {
        proxy_pass http://app:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        # 클라이언트가 보낸 X-Forwarded-For를 그대로 이어붙이면 IP를 위조해 사용량 제한을 우회할 수 있다.
        # Nginx가 유일한 입구이므로 실제 접속 IP로 덮어쓴다.
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Claude 응답 대기를 고려한 타임아웃
        proxy_read_timeout 60s;
    }
}
