# 운영 서버(2GB)용 구성. 비밀값은 서버의 /home/deploy/app/.env 에만 있다.
# 외부에 여는 포트는 Nginx(80, 443)뿐이다. Docker가 연 포트는 ufw 방화벽을 우회하므로
# PostgreSQL과 Redis는 ports를 절대 열지 않는다.
services:
  app:
    # 배포 시 .env의 IMAGE_TAG(커밋 SHA)로 고정한다. latest는 서버에 예전 이미지가 남아 있을 수 있어 쓰지 않는다
    image: ghcr.io/minunglee/spring-llm-gateway:${IMAGE_TAG:?IMAGE_TAG is required}
    restart: unless-stopped
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/gateway
      SPRING_DATASOURCE_USERNAME: gateway
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD}
      SPRING_DATA_REDIS_HOST: redis
      SERVER_FORWARD_HEADERS_STRATEGY: framework
      GATEWAY_LLM_MODE: ${GATEWAY_LLM_MODE:-mock}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      GATEWAY_IP_SALT: ${GATEWAY_IP_SALT}
      GATEWAY_ADMIN_TOKEN: ${GATEWAY_ADMIN_TOKEN}
      GATEWAY_COOKIE_SECRET: ${GATEWAY_COOKIE_SECRET}
      GATEWAY_RESUME_DIR: /app/private
      GATEWAY_TURNSTILE_SITE_KEY: ${GATEWAY_TURNSTILE_SITE_KEY:-}
      GATEWAY_TURNSTILE_SECRET_KEY: ${GATEWAY_TURNSTILE_SECRET_KEY:-}
    volumes:
      # 이력서 원본은 서버에만 있다 (Git에 없음)
      - ./private:/app/private:ro
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
    mem_limit: 768m

  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    command: ["postgres", "-c", "shared_buffers=64MB", "-c", "max_connections=30"]
    environment:
      POSTGRES_DB: gateway
      POSTGRES_USER: gateway
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U gateway -d gateway"]
      interval: 5s
      retries: 10
    mem_limit: 256m

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--maxmemory", "48mb", "--maxmemory-policy", "volatile-lru", "--appendonly", "yes"]
    volumes:
      - redis-data:/data
    mem_limit: 64m

  nginx:
    image: nginx:1.29-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      # 사이트별 설정 파일 폴더 (00-common.conf, gateway.conf, jipdon 저장소의 jipdon.conf)
      - ./nginx:/etc/nginx/conf.d:ro
      # 다른 저장소가 배포하는 정적 사이트 (예: /var/www/sites/jipdon/current)
      - /home/deploy/sites:/var/www/sites:ro
      # 인증서는 서버의 certbot이 관리한다 (발급·갱신 확인 파일은 certbot-www)
      - /etc/letsencrypt:/etc/letsencrypt:ro
      - ./certbot-www:/var/www/certbot:ro
    depends_on:
      - app
    mem_limit: 32m

volumes:
  postgres-data:
  redis-data:
